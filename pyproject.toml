[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mad-mod-engine"
version = "1.0.0"
description = "Mad Mod Engine: inspector y editor autorizado de memoria para Windows"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-MAD-Engine-No-Sale"
license-files = ["LICENSE"]
dependencies = [
  "PySide6>=6.8,<7",
  "psutil>=6.0",
  "numpy>=2.0",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-qt>=4.4", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6.10"]

[project.scripts]
mad-mod-engine = "mempilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "ARG", "TID", "N"]
ignore = ["N802", "N803"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "mempilot.core.win32_api"
disallow_untyped_calls = false
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "psutil.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=120"
markers = [
  "windows: requiere Windows y APIs Win32 reales",
  "integration: arranca procesos hijo y lee/escribe su memoria",
  "gui: requiere Qt (usa QT_QPA_PLATFORM=offscreen)",
  "slow: tarda más de 5 s",
]
